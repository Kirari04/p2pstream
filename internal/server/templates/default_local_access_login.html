<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ .page_title }}</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f0e8;
      --muted: #9aa3ad;
      --line: #303942;
      --panel: #11171c;
      --accent: #35d399;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #080b0e;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: "Trebuchet MS", Verdana, sans-serif;
    }
    .shell { width: min(100%, 430px); }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 18px 18px 0 #050708;
      padding: 34px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }
    .sub {
      margin: 10px 0 28px;
      color: var(--muted);
      line-height: 1.55;
    }
    .error {
      margin: 0 0 20px;
      border-left: 3px solid #fb7185;
      background: #28151a;
      color: #fecdd3;
      padding: 11px 13px;
      line-height: 1.45;
    }
    .error:empty { display: none; }
    .field {
      display: grid;
      gap: 8px;
      margin-top: 18px;
      color: #c7cdd3;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      border: 1px solid #3a4650;
      border-radius: 2px;
      outline: none;
      background: #090d10;
      color: var(--ink);
      padding: 13px 14px;
      font: inherit;
      font-size: 16px;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(53, 211, 153, 0.16);
    }
    button {
      width: 100%;
      margin-top: 24px;
      border: 0;
      border-radius: 2px;
      background: var(--accent);
      color: #042218;
      padding: 14px 16px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }
    button:hover { filter: brightness(1.08); }
    .foot {
      margin: 18px 0 0;
      color: #6f7a84;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">Private route</p>
    <section class="card">
      <h1>Sign in</h1>
      <p class="sub">Use your local account to continue to {{ .provider_name }}.</p>
      <p class="error" role="alert">{{ .error_message }}</p>
      <form method="post" action="{{ .login_action }}">
        <input type="hidden" name="{{ .csrf_field_name }}" value="{{ .csrf_token }}">
        <label class="field">
          Username
          <input name="{{ .username_field_name }}" value="{{ .username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </label>
        <label class="field">
          Password
          <input type="password" name="{{ .password_field_name }}" autocomplete="current-password" required>
        </label>
        <button type="submit">Continue</button>
      </form>
    </section>
    <p class="foot">Authentication provided by p2pstream for {{ .host }}</p>
  </main>
</body>
</html>
