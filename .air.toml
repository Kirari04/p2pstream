root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["server"]
  bin = "./tmp/p2pstream-dev"
  cmd = "go build -o ./tmp/p2pstream-dev ."
  delay = 1000
  exclude_dir = ["cmd/agentupdate-manifest", "cmd/serverupdate-manifest", "internal/db/testdata", "internal/server/p2pstream-data", "internal/smoketest", "third_party/yamux/testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "gen/proto", "internal", "stats", "third_party/yamux"]
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_file = ["main.go", "go.mod", "go.sum"]
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
