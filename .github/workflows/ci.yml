name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-source-gate:
    if: github.event_name == 'pull_request'
    name: Main source gate
    runs-on: ubuntu-latest
    steps:
      - name: Require staging source for main
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "staging" ]]; then
            echo "Pull requests to main must come from the staging branch." >&2
            exit 1
          fi

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Generate code
        run: make generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Check installer syntax
        run: bash -n scripts/install-agent.sh scripts/uninstall-agent.sh scripts/install-server-updater.sh scripts/server-updater-compose.sh scripts/test-server-updater.sh

      - name: Run installer lifecycle tests
        run: scripts/test-agent-lifecycle.sh

      - name: Run Go tests
        run: go test ./...

      - name: Test local Yamux extension and races
        # Upstream's short mode excludes its 250 MiB and 16 GiB stress transfers,
        # which still run in full below without race-detector throughput overhead.
        run: |
          go test ./...
          go test -race -short ./...
        working-directory: third_party/yamux

      - name: Run Go vet
        run: go vet ./...

      - name: Run frontend unit tests
        run: cd web/management && bun run test

      - name: Typecheck management UI
        run: cd web/management && bun run typecheck

      - name: Build management UI
        run: cd web/management && bun run build

      - name: Install update-test browser
        run: cd web/management && bunx playwright install --with-deps chromium

      - name: Run isolated server update browser tests
        run: cd web/management && bun run e2e:updates

      - name: Build runtime image
        run: docker build --target runtime -t p2pstream:ci .

      - name: Rehearse server update lifecycle in isolated Docker
        timeout-minutes: 20
        run: make docker-server-updater-test

      - name: Upload server updater rehearsal artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-updater-rehearsal
          path: tmp/server-updater-tests/
          if-no-files-found: ignore
          retention-days: 7
