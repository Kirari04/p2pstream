name: Release channels

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel. Staging must run from staging; stable from main."
        required: true
        type: choice
        default: stable
        options:
          - stable
          - staging
      version:
        description: "Exact immutable tag (vX.Y.Z or vX.Y.Z-staging.N). Staging pushes derive this automatically."
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.event_name == 'push' && 'staging' || inputs.channel }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify and resolve release identity
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      tag: ${{ steps.version.outputs.tag }}
      sequence: ${{ steps.version.outputs.sequence }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Generate code
        run: make generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Check installer syntax
        run: bash -n scripts/install-agent.sh scripts/uninstall-agent.sh

      - name: Run installer lifecycle tests
        run: scripts/test-agent-lifecycle.sh

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run frontend unit tests
        run: cd web/management && bun run test

      - name: Typecheck management UI
        run: cd web/management && bun run typecheck

      - name: Build management UI
        run: cd web/management && bun run build

      - name: Resolve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          git fetch --tags --force
          channel="${REQUESTED_CHANNEL}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            channel=staging
          fi
          expected_ref=refs/heads/main
          if [[ "${channel}" == "staging" ]]; then
            expected_ref=refs/heads/staging
          elif [[ "${channel}" != "stable" ]]; then
            echo "Release channel must be stable or staging" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "${channel} releases must run from ${expected_ref}, not ${GITHUB_REF}" >&2
            exit 1
          fi

          tag="${REQUESTED_VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
            if [[ -z "${latest_tag}" ]]; then
              echo "Cannot derive a staging prerelease without an existing stable SemVer tag" >&2
              exit 1
            fi
            IFS=. read -r latest_major latest_minor latest_patch <<<"${latest_tag#v}"
            tag="v${latest_major}.${latest_minor}.$((latest_patch + 1))-staging.${GITHUB_RUN_NUMBER}"
          fi

          if [[ "${channel}" == "stable" ]]; then
            version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          else
            version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-staging\.([1-9][0-9]*)$'
          fi
          if [[ ! "${tag}" =~ ${version_pattern} ]]; then
            echo "Resolved ${channel} tag has the wrong immutable SemVer form: ${tag}" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; releases are immutable" >&2
            exit 1
          fi

          version="${tag#v}"
          version="${version%%-*}"
          IFS=. read -r major minor patch <<<"${version}"
          for component in "${major}" "${minor}" "${patch}"; do
            if (( ${#component} > 6 || component > 999999 )); then
              echo "Release version component exceeds monotonic sequence encoding" >&2
              exit 1
            fi
          done
          if [[ "${channel}" == "stable" ]]; then
            sequence=$((major * 1000000000000 + minor * 1000000 + patch + 1))
          else
            ordinal="${tag##*.}"
            for component in "${major}" "${minor}" "${patch}"; do
              if (( component > 9999 )); then
                echo "Staging SemVer components must not exceed 9999" >&2
                exit 1
              fi
            done
            if (( ordinal > 99999 )); then
              echo "Staging prerelease ordinal must not exceed 99999" >&2
              exit 1
            fi
            sequence=$(((((major * 10000 + minor) * 10000 + patch) * 100000) + ordinal))
          fi

          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "sequence=${sequence}" >>"${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"

      - name: Set image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"${GITHUB_OUTPUT}"

  binary:
    name: Build Linux ${{ matrix.arch }} binary
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Build binary and source-complete archive
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          ARCH: ${{ matrix.arch }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X p2pstream/internal/buildinfo.Version=${TAG} -X p2pstream/internal/buildinfo.Commit=${GITHUB_SHA} -X p2pstream/internal/buildinfo.Repository=${SOURCE_REPOSITORY} -X p2pstream/internal/buildinfo.Channel=${CHANNEL}" -o dist/p2pstream main.go
          chmod +x dist/p2pstream
          cp dist/p2pstream "p2pstream_${TAG}_linux_${ARCH}"
          VERSION="${TAG}" COMMIT="${GITHUB_SHA}" SOURCE_REPOSITORY="${SOURCE_REPOSITORY}" make legal-notices
          mkdir -p dist/package
          cp dist/p2pstream dist/package/p2pstream
          cp -R dist/legal/. dist/package/
          tar -C dist/package -czf "p2pstream_${TAG}_linux_${ARCH}.tar.gz" .

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-${{ matrix.arch }}
          path: |
            p2pstream_${{ needs.verify.outputs.tag }}_linux_${{ matrix.arch }}
            p2pstream_${{ needs.verify.outputs.tag }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  image:
    name: Build Linux ${{ matrix.arch }} image
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ needs.verify.outputs.tag }}
            COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.repository }}
            RELEASE_CHANNEL=${{ needs.verify.outputs.channel }}
            VITE_RELEASE_REPOSITORY=${{ github.repository }}
            VITE_RELEASE_REF=${{ needs.verify.outputs.tag }}
          tags: ${{ needs.verify.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.arch }}

      - name: Record content-addressed architecture image
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Build did not return a canonical image digest" >&2; exit 1; }
          printf '%s@%s\n' "${IMAGE}" "${DIGEST}" >"p2pstream_${TAG}_image_linux_${ARCH}.txt"

      - name: Upload architecture image descriptor
        uses: actions/upload-artifact@v7
        with:
          name: image-linux-${{ matrix.arch }}
          path: p2pstream_${{ needs.verify.outputs.tag }}_image_linux_${{ matrix.arch }}.txt
          if-no-files-found: error

  release:
    name: Verify and publish ${{ needs.verify.outputs.channel }} release
    needs:
      - verify
      - binary
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-linux-*
          path: dist/artifacts

      - name: Download architecture image descriptors
        uses: actions/download-artifact@v8
        with:
          pattern: image-linux-*
          path: dist/image-descriptors

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare release assets
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/assets
          find dist/artifacts -type f \( -name '*.tar.gz' -o -name 'p2pstream_v*_linux_*' \) -exec cp {} dist/assets/ \;
          find dist/image-descriptors -type f -name 'p2pstream_v*_image_linux_*.txt' -exec cp {} dist/assets/ \;
          git archive --format=tar.gz --prefix="p2pstream-${TAG}/" -o "dist/assets/p2pstream_${TAG}_source.tar.gz" HEAD

      - name: Create and verify content-addressed image index
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          amd64_ref="$(cat "dist/assets/p2pstream_${TAG}_image_linux_amd64.txt")"
          arm64_ref="$(cat "dist/assets/p2pstream_${TAG}_image_linux_arm64.txt")"
          amd64_digest="${amd64_ref##*@}"
          arm64_digest="${arm64_ref##*@}"
          [[ "${amd64_ref}" == "${IMAGE}@${amd64_digest}" && "${arm64_ref}" == "${IMAGE}@${arm64_digest}" && "${amd64_digest}" =~ ^sha256:[0-9a-f]{64}$ && "${arm64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "Architecture image descriptor is malformed or names another repository" >&2; exit 1; }
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "${candidate}" "${amd64_ref}" "${arm64_ref}"
          docker buildx imagetools inspect "${candidate}" --format '{{json .Manifest}}' >dist/image-index-descriptor.json
          expected_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' dist/image-index-descriptor.json)"
          expected_size="$(jq -er '.size | select(type == "number" and . > 0 and . <= 65536 and floor == .)' dist/image-index-descriptor.json)"
          docker buildx imagetools inspect "${candidate}" --raw >dist/image-index-stdout
          actual_size="$(stat -c '%s' dist/image-index-stdout)"
          if (( actual_size == expected_size )); then
            cp dist/image-index-stdout "dist/assets/p2pstream_${TAG}_image_index.json"
          elif (( actual_size == expected_size + 1 )) && [[ "$(tail -c 1 dist/image-index-stdout | od -An -t u1 | tr -d ' ')" == "10" ]]; then
            head -c "${expected_size}" dist/image-index-stdout >"dist/assets/p2pstream_${TAG}_image_index.json"
          else
            echo "Registry returned an OCI index with an unexpected byte count" >&2
            exit 1
          fi
          actual_digest="sha256:$(sha256sum "dist/assets/p2pstream_${TAG}_image_index.json" | cut -d' ' -f1)"
          [[ "${actual_digest}" == "${expected_digest}" ]] || { echo "Raw OCI index does not match its registry descriptor digest" >&2; exit 1; }
          jq -e --arg amd64 "${amd64_digest}" --arg arm64 "${arm64_digest}" '
            (.manifests | length) == 2 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)] | length) == 1 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)] | length) == 1
          ' "dist/assets/p2pstream_${TAG}_image_index.json" >/dev/null

      - name: Generate canonical update manifest
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          RELEASE_SEQUENCE: ${{ needs.verify.outputs.sequence }}
          MANIFEST_VALIDITY_DAYS: ${{ vars.AGENT_UPDATE_MANIFEST_VALIDITY_DAYS }}
          SECURITY_EPOCH: ${{ vars.AGENT_UPDATE_SECURITY_EPOCH }}
          MIN_SAFE_VERSION: ${{ vars.AGENT_UPDATE_MIN_SAFE_VERSION }}
          SERVER_MIN_VERSION: ${{ vars.AGENT_UPDATE_SERVER_MIN_VERSION }}
          SERVER_MAX_VERSION: ${{ vars.AGENT_UPDATE_SERVER_MAX_VERSION }}
          UPDATER_MIN_VERSION: ${{ vars.AGENT_UPDATE_UPDATER_MIN_VERSION }}
          UPDATER_MAX_VERSION: ${{ vars.AGENT_UPDATE_UPDATER_MAX_VERSION }}
          PROTOCOL_MIN: ${{ vars.AGENT_UPDATE_PROTOCOL_MIN }}
          PROTOCOL_MAX: ${{ vars.AGENT_UPDATE_PROTOCOL_MAX }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          set -Eeuo pipefail
          : "${MANIFEST_VALIDITY_DAYS:?AGENT_UPDATE_MANIFEST_VALIDITY_DAYS variable is required}"
          : "${SECURITY_EPOCH:?AGENT_UPDATE_SECURITY_EPOCH variable is required}"
          : "${MIN_SAFE_VERSION:?AGENT_UPDATE_MIN_SAFE_VERSION variable is required}"
          : "${SERVER_MIN_VERSION:?AGENT_UPDATE_SERVER_MIN_VERSION variable is required}"
          : "${SERVER_MAX_VERSION:?AGENT_UPDATE_SERVER_MAX_VERSION variable is required}"
          : "${UPDATER_MIN_VERSION:?AGENT_UPDATE_UPDATER_MIN_VERSION variable is required}"
          : "${UPDATER_MAX_VERSION:?AGENT_UPDATE_UPDATER_MAX_VERSION variable is required}"
          : "${PROTOCOL_MIN:?AGENT_UPDATE_PROTOCOL_MIN variable is required}"
          : "${PROTOCOL_MAX:?AGENT_UPDATE_PROTOCOL_MAX variable is required}"
          if [[ ! "${MANIFEST_VALIDITY_DAYS}" =~ ^[1-9][0-9]{0,3}$ ]] || (( MANIFEST_VALIDITY_DAYS > 3650 )); then
            echo "AGENT_UPDATE_MANIFEST_VALIDITY_DAYS must be an integer from 1 through 3650" >&2
            exit 1
          fi

          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date -u -d "+${MANIFEST_VALIDITY_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          manifest=dist/assets/p2pstream_agent_update_manifest.json
          (cd dist/assets && sha256sum p2pstream_* >checksums.txt)
          go run ./cmd/agentupdate-manifest create \
            --channel "${CHANNEL}" \
            --version "${TAG}" \
            --commit "${GITHUB_SHA}" \
            --sequence "${RELEASE_SEQUENCE}" \
            --published-at "${published_at}" \
            --expires-at "${expires_at}" \
            --minimum-safe-version "${MIN_SAFE_VERSION}" \
            --security-epoch "${SECURITY_EPOCH}" \
            --server-min "${SERVER_MIN_VERSION}" \
            --server-max "${SERVER_MAX_VERSION}" \
            --protocol-min "${PROTOCOL_MIN}" \
            --protocol-max "${PROTOCOL_MAX}" \
            --updater-min "${UPDATER_MIN_VERSION}" \
            --updater-max "${UPDATER_MAX_VERSION}" \
            --artifact "linux/amd64=dist/assets/p2pstream_${TAG}_linux_amd64" \
            --artifact "linux/arm64=dist/assets/p2pstream_${TAG}_linux_arm64" \
            --oci-index "${IMAGE}=dist/assets/p2pstream_${TAG}_image_index.json" \
            --release-asset dist/assets/checksums.txt \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_index.json" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_amd64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_arm64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_source.tar.gz" \
            --output "${manifest}"

      - name: Verify manifest, identity, artifacts, and image
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          RELEASE_SEQUENCE: ${{ needs.verify.outputs.sequence }}
          PROTOCOL_CURRENT: ${{ vars.AGENT_UPDATE_PROTOCOL_CURRENT }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          set -Eeuo pipefail
          : "${PROTOCOL_CURRENT:?AGENT_UPDATE_PROTOCOL_CURRENT variable is required}"
          go run ./cmd/agentupdate-manifest verify-release \
            --manifest dist/assets/p2pstream_agent_update_manifest.json \
            --expected-version "${TAG}" \
            --expected-channel "${CHANNEL}" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-sequence "${RELEASE_SEQUENCE}" \
            --server-version "${TAG}" \
            --protocol-version "${PROTOCOL_CURRENT}" \
            --artifact "linux/amd64=dist/assets/p2pstream_${TAG}_linux_amd64" \
            --artifact "linux/arm64=dist/assets/p2pstream_${TAG}_linux_arm64" \
            --oci-index "${IMAGE}=dist/assets/p2pstream_${TAG}_image_index.json" \
            --release-asset dist/assets/checksums.txt \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_index.json" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_amd64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_arm64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_source.tar.gz"

      - name: Publish immutable OCI aliases
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
        run: |
          set -Eeuo pipefail
          index_digest="sha256:$(sha256sum "dist/assets/p2pstream_${TAG}_image_index.json" | cut -d' ' -f1)"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "dist/assets/p2pstream_${TAG}_image_index.json")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "dist/assets/p2pstream_${TAG}_image_index.json")"
          ensure_alias() {
            local alias="$1" expected="$2" prefer_index="$3" descriptor actual
            if descriptor="$(docker buildx imagetools inspect "${IMAGE}:${alias}" --format '{{json .Manifest}}' 2>/dev/null)"; then
              actual="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${descriptor}")"
              [[ "${actual}" == "${expected}" ]] || { echo "Existing image alias ${IMAGE}:${alias} points to another digest" >&2; exit 1; }
              return
            fi
            docker buildx imagetools create --prefer-index="${prefer_index}" -t "${IMAGE}:${alias}" "${IMAGE}@${expected}"
            actual="$(docker buildx imagetools inspect "${IMAGE}:${alias}" --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "${actual}" == "${expected}" ]] || { echo "Published image alias ${IMAGE}:${alias} has the wrong digest" >&2; exit 1; }
          }
          ensure_alias "${TAG}-linux-amd64" "${amd64_digest}" false
          ensure_alias "${TAG}-linux-arm64" "${arm64_digest}" false
          ensure_alias "${TAG}" "${index_digest}" true
          if [[ "${CHANNEL}" == "stable" ]]; then
            ensure_alias "sha-${SHORT_SHA}-linux-amd64" "${amd64_digest}" false
            ensure_alias "sha-${SHORT_SHA}-linux-arm64" "${arm64_digest}" false
            ensure_alias "sha-${SHORT_SHA}" "${index_digest}" true
          else
            ensure_alias "staging-sha-${SHORT_SHA}-linux-amd64" "${amd64_digest}" false
            ensure_alias "staging-sha-${SHORT_SHA}-linux-arm64" "${arm64_digest}" false
            ensure_alias "staging-sha-${SHORT_SHA}" "${index_digest}" true
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
        run: |
          set -Eeuo pipefail
          printf -v notes '%s\n\n%s\n\n%s' \
            "p2pstream ${CHANNEL} release ${TAG} for commit ${SHORT_SHA}." \
            "Managed agents trust this GitHub release and verify the canonical manifest identity, compatibility policy, exact asset sizes, and SHA-256 digests before activation." \
            "p2pstream is licensed under AGPL-3.0-or-later. Corresponding source is available in the p2pstream_${TAG}_source.tar.gz release asset and from the matching Git commit."
          release_flags=(--latest)
          if [[ "${CHANNEL}" == "staging" ]]; then
            release_flags=(--prerelease)
          fi
          gh release create "${TAG}" dist/assets/* --target "${GITHUB_SHA}" --title "${TAG}" --notes "${notes}" "${release_flags[@]}"

      - name: Verify published GitHub assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          expected_assets="$(find dist/assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual_assets="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [[ "${actual_assets}" == "${expected_assets}" ]] || { echo "Published GitHub release has the wrong asset set" >&2; exit 1; }
          target_commit="$(gh release view "${TAG}" --json targetCommitish --jq .targetCommitish)"
          [[ "${target_commit}" == "${GITHUB_SHA}" ]] || { echo "Published GitHub release targets ${target_commit}, not ${GITHUB_SHA}" >&2; exit 1; }
          mkdir -p dist/published
          gh release download "${TAG}" --dir dist/published
          for asset in dist/assets/*; do
            cmp -s "${asset}" "dist/published/$(basename "${asset}")" || { echo "Published asset $(basename "${asset}") differs from the verified build" >&2; exit 1; }
          done

      - name: Move channel image alias
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          set -Eeuo pipefail
          index_digest="sha256:$(sha256sum "dist/assets/p2pstream_${TAG}_image_index.json" | cut -d' ' -f1)"
          alias=latest
          if [[ "${CHANNEL}" == "staging" ]]; then
            alias=staging
          fi
          docker buildx imagetools create -t "${IMAGE}:${alias}" "${IMAGE}@${index_digest}"
          alias_digest="$(docker buildx imagetools inspect "${IMAGE}:${alias}" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${alias_digest}" == "${index_digest}" ]] || { echo "Channel image alias has the wrong digest" >&2; exit 1; }
