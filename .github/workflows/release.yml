name: Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Prepare an unsigned draft, or publish it after offline threshold signing."
        required: true
        type: choice
        options:
          - prepare
          - publish
      version:
        description: "Exact immutable release tag, for example v0.1.50."
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Verify and resolve version
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      tag: ${{ steps.version.outputs.tag }}
      sequence: ${{ steps.version.outputs.sequence }}
      release_is_draft: ${{ steps.version.outputs.release_is_draft }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Generate code
        run: make generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Check installer syntax
        run: bash -n scripts/install-agent.sh scripts/uninstall-agent.sh

      - name: Run installer lifecycle tests
        run: scripts/test-agent-lifecycle.sh

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run frontend unit tests
        run: cd web/management && bun run test

      - name: Typecheck management UI
        run: cd web/management && bun run typecheck

      - name: Build management UI
        run: cd web/management && bun run build

      - name: Resolve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          git fetch --tags --force
          tag="${{ inputs.version }}"

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Resolved release tag is not canonical vX.Y.Z: ${tag}" >&2
            exit 1
          fi

          phase="${{ inputs.phase }}"
          if [[ "$phase" == "prepare" ]]; then
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Stable tag ${tag} already exists; stable releases are immutable" >&2
              exit 1
            fi
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} already exists; refusing to replace its draft assets" >&2
              exit 1
            fi
          else
            is_draft="$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "$is_draft" != "true" && "$is_draft" != "false" ]]; then
              echo "A prepared release ${tag} is required before publish or recovery" >&2
              exit 1
            fi
            target_commit="$(gh release view "${tag}" --json targetCommitish --jq .targetCommitish)"
            if [[ ! "$target_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Prepared draft ${tag} is not pinned to an exact commit" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
              if [[ "$tag_commit" != "$target_commit" ]]; then
                echo "Draft release tag ${tag} moved away from its prepared commit" >&2
                exit 1
              fi
            fi
            echo "release_is_draft=${is_draft}" >>"$GITHUB_OUTPUT"
          fi

          version="${tag#v}"
          IFS=. read -r major minor patch <<<"$version"
          for component in "$major" "$minor" "$patch"; do
            if (( ${#component} > 6 )); then
              echo "Release version component is too large" >&2
              exit 1
            fi
            if (( component > 999999 )); then
              echo "Release version component exceeds monotonic sequence encoding" >&2
              exit 1
            fi
          done
          sequence=$((major * 1000000000000 + minor * 1000000 + patch + 1))

          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          echo "sequence=${sequence}" >>"$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

  binary:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'prepare'
    name: Build Linux ${{ matrix.arch }} binary
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Build binary
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X p2pstream/internal/buildinfo.Version=${TAG} -X p2pstream/internal/buildinfo.Commit=${GITHUB_SHA} -X p2pstream/internal/buildinfo.Repository=${SOURCE_REPOSITORY}" -o dist/p2pstream main.go
          chmod +x dist/p2pstream
          cp dist/p2pstream "p2pstream_${TAG}_linux_${ARCH}"
          VERSION="${TAG}" COMMIT="${GITHUB_SHA}" SOURCE_REPOSITORY="${SOURCE_REPOSITORY}" make legal-notices
          mkdir -p dist/package
          cp dist/p2pstream dist/package/p2pstream
          cp -R dist/legal/. dist/package/
          tar -C dist/package -czf "p2pstream_${TAG}_linux_${ARCH}.tar.gz" .

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-${{ matrix.arch }}
          path: |
            p2pstream_${{ needs.verify.outputs.tag }}_linux_${{ matrix.arch }}
            p2pstream_${{ needs.verify.outputs.tag }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  image:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'prepare'
    name: Build Linux ${{ matrix.arch }} image
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ needs.verify.outputs.tag }}
            COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.repository }}
            VITE_RELEASE_REPOSITORY=${{ github.repository }}
            VITE_RELEASE_REF=${{ needs.verify.outputs.tag }}
          tags: |
            ${{ needs.verify.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.arch }}

      - name: Record content-addressed architecture image
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "Build did not return a canonical image digest" >&2; exit 1; }
          printf '%s@%s\n' "${IMAGE}" "${DIGEST}" >"p2pstream_${TAG}_image_linux_${ARCH}.txt"

      - name: Upload architecture image descriptor
        uses: actions/upload-artifact@v7
        with:
          name: image-linux-${{ matrix.arch }}
          path: p2pstream_${{ needs.verify.outputs.tag }}_image_linux_${{ matrix.arch }}.txt
          if-no-files-found: error

  prepare:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'prepare'
    name: Prepare unsigned draft release
    needs:
      - verify
      - binary
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: binary-linux-*
          path: dist/artifacts

      - name: Download architecture image descriptors
        uses: actions/download-artifact@v8
        with:
          pattern: image-linux-*
          path: dist/image-descriptors

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare release assets
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/assets
          find dist/artifacts -type f \( -name '*.tar.gz' -o -name 'p2pstream_v*_linux_*' \) -exec cp {} dist/assets/ \;
          find dist/image-descriptors -type f -name 'p2pstream_v*_image_linux_*.txt' -exec cp {} dist/assets/ \;
          git archive --format=tar.gz --prefix="p2pstream-${TAG}/" -o "dist/assets/p2pstream_${TAG}_source.tar.gz" HEAD

      - name: Create content-addressed candidate image index
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          amd64_ref="$(cat "dist/assets/p2pstream_${TAG}_image_linux_amd64.txt")"
          arm64_ref="$(cat "dist/assets/p2pstream_${TAG}_image_linux_arm64.txt")"
          amd64_digest="${amd64_ref##*@}"
          arm64_digest="${arm64_ref##*@}"
          [[ "${amd64_ref}" == "${IMAGE}@${amd64_digest}" && "${arm64_ref}" == "${IMAGE}@${arm64_digest}" && \
             "${amd64_digest}" =~ ^sha256:[0-9a-f]{64}$ && "${arm64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "Architecture image descriptor is malformed or names another repository" >&2; exit 1; }
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            --metadata-file dist/image-index-metadata.json \
            -t "${candidate}" \
            "${amd64_ref}" "${arm64_ref}"
          docker buildx imagetools inspect "${candidate}" \
            --format '{{json .Manifest}}' >dist/image-index-descriptor.json
          expected_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' dist/image-index-descriptor.json)"
          expected_size="$(jq -er '.size | select(type == "number" and . > 0 and . <= 65536 and floor == .)' dist/image-index-descriptor.json)"
          docker buildx imagetools inspect "${candidate}" --raw >dist/image-index-stdout
          actual_size="$(stat -c '%s' dist/image-index-stdout)"
          if (( actual_size == expected_size )); then
            cp dist/image-index-stdout "dist/assets/p2pstream_${TAG}_image_index.json"
          elif (( actual_size == expected_size + 1 )) && [[ "$(tail -c 1 dist/image-index-stdout | od -An -t u1 | tr -d ' ')" == "10" ]]; then
            head -c "${expected_size}" dist/image-index-stdout >"dist/assets/p2pstream_${TAG}_image_index.json"
          else
            echo "Registry returned an OCI index with an unexpected byte count" >&2
            exit 1
          fi
          actual_digest="sha256:$(sha256sum "dist/assets/p2pstream_${TAG}_image_index.json" | cut -d' ' -f1)"
          [[ "${actual_digest}" == "${expected_digest}" ]] \
            || { echo "Raw OCI index does not match its registry descriptor digest" >&2; exit 1; }
          jq -e --arg amd64 "${amd64_digest}" --arg arm64 "${arm64_digest}" '
            (.manifests | length) == 2 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)] | length) == 1 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)] | length) == 1
          ' "dist/assets/p2pstream_${TAG}_image_index.json" >/dev/null \
            || { echo "Candidate OCI index does not contain exactly the built amd64 and arm64 manifests" >&2; exit 1; }

      - name: Generate immutable unsigned update manifest
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SEQUENCE: ${{ needs.verify.outputs.sequence }}
          ROOT_METADATA_BASE64: ${{ vars.AGENT_UPDATE_ROOT_METADATA_BASE64 }}
          MANIFEST_VALIDITY_DAYS: ${{ vars.AGENT_UPDATE_MANIFEST_VALIDITY_DAYS }}
          SECURITY_EPOCH: ${{ vars.AGENT_UPDATE_SECURITY_EPOCH }}
          MIN_SAFE_VERSION: ${{ vars.AGENT_UPDATE_MIN_SAFE_VERSION }}
          SERVER_MIN_VERSION: ${{ vars.AGENT_UPDATE_SERVER_MIN_VERSION }}
          SERVER_MAX_VERSION: ${{ vars.AGENT_UPDATE_SERVER_MAX_VERSION }}
          UPDATER_MIN_VERSION: ${{ vars.AGENT_UPDATE_UPDATER_MIN_VERSION }}
          UPDATER_MAX_VERSION: ${{ vars.AGENT_UPDATE_UPDATER_MAX_VERSION }}
          PROTOCOL_MIN: ${{ vars.AGENT_UPDATE_PROTOCOL_MIN }}
          PROTOCOL_MAX: ${{ vars.AGENT_UPDATE_PROTOCOL_MAX }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          set -Eeuo pipefail
          : "${ROOT_METADATA_BASE64:?AGENT_UPDATE_ROOT_METADATA_BASE64 variable is required}"
          : "${MANIFEST_VALIDITY_DAYS:?AGENT_UPDATE_MANIFEST_VALIDITY_DAYS variable is required}"
          : "${SECURITY_EPOCH:?AGENT_UPDATE_SECURITY_EPOCH variable is required}"
          : "${MIN_SAFE_VERSION:?AGENT_UPDATE_MIN_SAFE_VERSION variable is required}"
          : "${SERVER_MIN_VERSION:?AGENT_UPDATE_SERVER_MIN_VERSION variable is required}"
          : "${SERVER_MAX_VERSION:?AGENT_UPDATE_SERVER_MAX_VERSION variable is required}"
          : "${UPDATER_MIN_VERSION:?AGENT_UPDATE_UPDATER_MIN_VERSION variable is required}"
          : "${UPDATER_MAX_VERSION:?AGENT_UPDATE_UPDATER_MAX_VERSION variable is required}"
          : "${PROTOCOL_MIN:?AGENT_UPDATE_PROTOCOL_MIN variable is required}"
          : "${PROTOCOL_MAX:?AGENT_UPDATE_PROTOCOL_MAX variable is required}"
          if [[ ! "${MANIFEST_VALIDITY_DAYS}" =~ ^[1-9][0-9]{0,3}$ ]] || (( MANIFEST_VALIDITY_DAYS > 3650 )); then
            echo "AGENT_UPDATE_MANIFEST_VALIDITY_DAYS must be an integer from 1 through 3650" >&2
            exit 1
          fi

          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date -u -d "+${MANIFEST_VALIDITY_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          manifest="dist/assets/p2pstream_agent_update_manifest.json"
          root="dist/assets/p2pstream_agent_update_root.json"
          printf '%s' "${ROOT_METADATA_BASE64}" | base64 --decode >"${root}"
          (cd dist/assets && sha256sum p2pstream_* >checksums.txt)

          go run ./cmd/agentupdate-manifest create \
            --channel stable \
            --root "${root}" \
            --version "${TAG}" \
            --commit "${GITHUB_SHA}" \
            --sequence "${RELEASE_SEQUENCE}" \
            --published-at "${published_at}" \
            --expires-at "${expires_at}" \
            --minimum-safe-version "${MIN_SAFE_VERSION}" \
            --security-epoch "${SECURITY_EPOCH}" \
            --server-min "${SERVER_MIN_VERSION}" \
            --server-max "${SERVER_MAX_VERSION}" \
            --protocol-min "${PROTOCOL_MIN}" \
            --protocol-max "${PROTOCOL_MAX}" \
            --updater-min "${UPDATER_MIN_VERSION}" \
            --updater-max "${UPDATER_MAX_VERSION}" \
            --artifact "linux/amd64=dist/assets/p2pstream_${TAG}_linux_amd64" \
            --artifact "linux/arm64=dist/assets/p2pstream_${TAG}_linux_arm64" \
            --oci-index "${IMAGE}=dist/assets/p2pstream_${TAG}_image_index.json" \
            --release-asset dist/assets/checksums.txt \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_index.json" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_amd64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_arm64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_source.tar.gz" \
            --release-asset dist/assets/p2pstream_agent_update_root.json \
            --output "${manifest}"

      - name: Create immutable draft candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
        run: |
          set -Eeuo pipefail

          printf -v notes '%s\n\n%s\n\n%s' \
            "Unsigned p2pstream release candidate ${TAG} for commit ${SHORT_SHA}." \
            "This draft is not a trusted agent update until independent offline signers approve the exact manifest and the publish phase verifies their threshold envelope." \
            "p2pstream is licensed under AGPL-3.0-or-later. Corresponding source is available in the p2pstream_${TAG}_source.tar.gz release asset and from the matching Git commit."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to modify it" >&2
            exit 1
          fi
          gh release create "$TAG" dist/assets/* --draft --target "${GITHUB_SHA}" --title "$TAG" --notes "$notes"

  publish:
    if: github.ref == 'refs/heads/main' && inputs.phase == 'publish'
    name: Verify offline quorum and publish
    needs:
      - verify
    runs-on: ubuntu-latest
    environment: agent-update-publish
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download the prepared draft exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/assets
          expected_assets="$(cat <<EOF
          checksums.txt
          p2pstream_${TAG}_linux_amd64
          p2pstream_${TAG}_linux_amd64.tar.gz
          p2pstream_${TAG}_linux_arm64
          p2pstream_${TAG}_linux_arm64.tar.gz
          p2pstream_${TAG}_image_index.json
          p2pstream_${TAG}_image_linux_amd64.txt
          p2pstream_${TAG}_image_linux_arm64.txt
          p2pstream_${TAG}_source.tar.gz
          p2pstream_agent_update_manifest.json
          p2pstream_agent_update_root.json
          EOF
          )"
          actual_assets="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          unsigned_assets="$(printf '%s\n' "$actual_assets" | grep -Fvx 'p2pstream_agent_update_manifest.signatures.json' || true)"
          if [[ "$unsigned_assets" != "$(printf '%s\n' "$expected_assets" | sed 's/^[[:space:]]*//' | LC_ALL=C sort)" ]]; then
            echo "Draft release asset set changed after preparation" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi
          gh release download "${TAG}" --dir dist/assets

      - name: Install independently produced threshold signatures
        shell: bash
        env:
          OFFLINE_SIGNATURES_BASE64: ${{ secrets.AGENT_UPDATE_OFFLINE_SIGNATURES_BASE64 }}
        run: |
          set -Eeuo pipefail
          : "${OFFLINE_SIGNATURES_BASE64:?The protected environment must provide AGENT_UPDATE_OFFLINE_SIGNATURES_BASE64}"
          printf '%s' "${OFFLINE_SIGNATURES_BASE64}" | base64 --decode >dist/offline-signatures.json
          if [[ -e dist/assets/p2pstream_agent_update_manifest.signatures.json ]]; then
            cmp -s dist/offline-signatures.json dist/assets/p2pstream_agent_update_manifest.signatures.json \
              || { echo "Existing signature asset differs from the protected offline quorum" >&2; exit 1; }
          else
            mv dist/offline-signatures.json dist/assets/p2pstream_agent_update_manifest.signatures.json
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Read the signed candidate image by digest
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          index_digest="sha256:$(sha256sum "dist/assets/p2pstream_${TAG}_image_index.json" | cut -d' ' -f1)"
          docker buildx imagetools inspect "${IMAGE}@${index_digest}" \
            --format '{{json .Manifest}}' >dist/registry-image-descriptor.json
          expected_size="$(jq -er '.size | select(type == "number" and . > 0 and . <= 65536 and floor == .)' dist/registry-image-descriptor.json)"
          docker buildx imagetools inspect "${IMAGE}@${index_digest}" \
            --raw >dist/registry-image-index-stdout
          actual_size="$(stat -c '%s' dist/registry-image-index-stdout)"
          if (( actual_size == expected_size )); then
            cp dist/registry-image-index-stdout dist/registry-image-index.json
          elif (( actual_size == expected_size + 1 )) && [[ "$(tail -c 1 dist/registry-image-index-stdout | od -An -t u1 | tr -d ' ')" == "10" ]]; then
            head -c "${expected_size}" dist/registry-image-index-stdout >dist/registry-image-index.json
          else
            echo "Registry returned an OCI index with an unexpected byte count" >&2
            exit 1
          fi
          actual_digest="sha256:$(sha256sum dist/registry-image-index.json | cut -d' ' -f1)"
          descriptor_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' dist/registry-image-descriptor.json)"
          [[ "${actual_digest}" == "${index_digest}" && "${descriptor_digest}" == "${index_digest}" ]] \
            || { echo "Registry OCI index no longer matches the signed content address" >&2; exit 1; }

      - name: Verify root, quorum, release identity, and every updater artifact
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SEQUENCE: ${{ needs.verify.outputs.sequence }}
          GH_TOKEN: ${{ github.token }}
          ROOT_METADATA_BASE64: ${{ vars.AGENT_UPDATE_ROOT_METADATA_BASE64 }}
          PROTOCOL_CURRENT: ${{ vars.AGENT_UPDATE_PROTOCOL_CURRENT }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          set -Eeuo pipefail
          : "${ROOT_METADATA_BASE64:?AGENT_UPDATE_ROOT_METADATA_BASE64 variable is required}"
          : "${PROTOCOL_CURRENT:?AGENT_UPDATE_PROTOCOL_CURRENT variable is required}"
          printf '%s' "${ROOT_METADATA_BASE64}" | base64 --decode >dist/expected-root.json
          cmp -s dist/expected-root.json dist/assets/p2pstream_agent_update_root.json \
            || { echo "Draft release root does not match the configured out-of-band root" >&2; exit 1; }
          target_commit="$(gh release view "${TAG}" --json targetCommitish --jq .targetCommitish)"
          [[ "$target_commit" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "Draft release target is not an exact commit" >&2; exit 1; }
          go run ./cmd/agentupdate-manifest verify-release \
            --manifest dist/assets/p2pstream_agent_update_manifest.json \
            --root dist/assets/p2pstream_agent_update_root.json \
            --signatures dist/assets/p2pstream_agent_update_manifest.signatures.json \
            --expected-version "${TAG}" \
            --expected-commit "${target_commit}" \
            --expected-sequence "${RELEASE_SEQUENCE}" \
            --server-version "${TAG}" \
            --protocol-version "${PROTOCOL_CURRENT}" \
            --artifact "linux/amd64=dist/assets/p2pstream_${TAG}_linux_amd64" \
            --artifact "linux/arm64=dist/assets/p2pstream_${TAG}_linux_arm64" \
            --oci-index "${IMAGE}=dist/registry-image-index.json" \
            --release-asset dist/assets/checksums.txt \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_amd64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64" \
            --release-asset "dist/assets/p2pstream_${TAG}_linux_arm64.tar.gz" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_index.json" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_amd64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_image_linux_arm64.txt" \
            --release-asset "dist/assets/p2pstream_${TAG}_source.tar.gz" \
            --release-asset dist/assets/p2pstream_agent_update_root.json

      - name: Attach signatures without replacing any candidate asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fxq p2pstream_agent_update_manifest.signatures.json; then
            echo "The exact signature asset is already attached; continuing the idempotent publish"
          else
            gh release upload "${TAG}" dist/assets/p2pstream_agent_update_manifest.signatures.json
          fi

      - name: Publish and verify signed OCI aliases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          target_commit="$(gh release view "${TAG}" --json targetCommitish --jq .targetCommitish)"
          short_sha="${target_commit:0:7}"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          index_digest="sha256:$(sha256sum dist/registry-image-index.json | cut -d' ' -f1)"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' dist/registry-image-index.json)"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' dist/registry-image-index.json)"
          ensure_alias() {
            local alias="$1"
            local expected="$2"
            local prefer_index="$3"
            local descriptor
            if descriptor="$(docker buildx imagetools inspect "${IMAGE}:${alias}" --format '{{json .Manifest}}' 2>/dev/null)"; then
              actual="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${descriptor}")"
              [[ "${actual}" == "${expected}" ]] \
                || { echo "Existing image alias ${IMAGE}:${alias} points to ${actual}, not signed ${expected}" >&2; exit 1; }
              return
            fi
            docker buildx imagetools create --prefer-index="${prefer_index}" \
              -t "${IMAGE}:${alias}" "${IMAGE}@${expected}"
            actual="$(docker buildx imagetools inspect "${IMAGE}:${alias}" --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "${actual}" == "${expected}" ]] \
              || { echo "Published image alias ${IMAGE}:${alias} did not resolve to signed ${expected}" >&2; exit 1; }
          }
          ensure_alias "${TAG}-linux-amd64" "${amd64_digest}" false
          ensure_alias "sha-${short_sha}-linux-amd64" "${amd64_digest}" false
          ensure_alias "${TAG}-linux-arm64" "${arm64_digest}" false
          ensure_alias "sha-${short_sha}-linux-arm64" "${arm64_digest}" false
          ensure_alias "${TAG}" "${index_digest}" true
          ensure_alias "sha-${short_sha}" "${index_digest}" true

      - name: Publish immutable stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_IS_DRAFT: ${{ needs.verify.outputs.release_is_draft }}
        run: |
          set -Eeuo pipefail
          if [[ "${RELEASE_IS_DRAFT}" == "true" ]]; then
            gh release edit "${TAG}" --draft=false --latest
          else
            gh release edit "${TAG}" --latest
          fi

      - name: Move latest image alias to the published release
        shell: bash
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -Eeuo pipefail
          index_digest="sha256:$(sha256sum dist/registry-image-index.json | cut -d' ' -f1)"
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${index_digest}"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${latest_digest}" == "${index_digest}" ]] \
            || { echo "Latest image alias did not resolve to the published signed index" >&2; exit 1; }
