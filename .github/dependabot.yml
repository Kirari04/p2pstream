version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web/management"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7.0 has no programmatic API, so vue-tsc cannot use it.
      # Revisit for 7.1, when the TypeScript team plans to restore that API.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
