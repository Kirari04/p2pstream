  MANAGEMENT_TRUST_ERROR_CODE_INVALID_BUNDLE = 1;
  MANAGEMENT_TRUST_ERROR_CODE_HOSTNAME_MISMATCH = 2;
  MANAGEMENT_TRUST_ERROR_CODE_PERSIST_FAILED = 3;
  MANAGEMENT_TRUST_ERROR_CODE_RELOAD_FAILED = 4;
}

