  int64 max_replay_body_bytes = 8;
  repeated int64 route_ids = 9;
  repeated int64 target_ids = 10;
  PublicPolicyMatchRule match_rule = 11;
  // Required when the rule can retry after an upstream may have observed the
  // request, when response statuses or buffered response bodies are retried,
  // or when it includes methods with side effects.
  bool duplicate_risk_acknowledged = 12;
  // Exact 400-599 upstream response statuses that trigger another attempt.
  repeated int64 retry_status_codes = 13;
  PublicRetryResponseBodyMode response_body_mode = 14;
  int64 max_buffered_response_body_bytes = 15;
  int64 max_buffered_response_wait_millis = 16;
}

