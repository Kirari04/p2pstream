  MANAGEMENT_TLS_ROTATION_PHASE_ACTIVE = 3;
  MANAGEMENT_TLS_ROTATION_PHASE_RETIRING = 4;
  MANAGEMENT_TLS_ROTATION_PHASE_CLEANING_UP = 5;
}

