// The structured fields let both sides validate policy without parsing an
// ad-hoc wire format. canonical_payload is the exact domain-separated byte
// string produced by internal/agentupdateauth and signature authenticates
// those bytes. Receivers must reconstruct and compare canonical_payload before
// accepting or persisting the record.
message AgentUpdaterEnrollmentReceipt {
  reserved 9, 10;
  reserved "trusted_root_sha256", "trusted_root_version";
  string agent_public_id = 1;
  string updater_key_id = 2;
  string updater_public_key_sha256 = 3;
  string activator_key_id = 4;
  string activator_public_key_sha256 = 5;
  string os = 6;
  string arch = 7;
  string updater_version = 8;
  string pinned_repository = 11;
  string authority_key_id = 12;
  uint64 authority_epoch = 13;
  int64 enrolled_at_unix_millis = 14;
  int64 expires_at_unix_millis = 15;
  uint64 generation = 16;
  bytes canonical_payload = 17;
  bytes signature = 18;
}

message AgentUpdateAssignmentAuthorization {
  reserved 13;
  reserved "root_version";
  string agent_public_id = 1;
  int64 assignment_id = 2;
  int64 campaign_id = 3;
  int64 generation = 4;
  AgentUpdateDesiredAction action = 5;
  uint64 command_sequence = 6;
  bytes nonce = 7;
  int64 issued_at_unix_millis = 8;
  int64 expires_at_unix_millis = 9;
  string authority_key_id = 10;
  uint64 authority_epoch = 11;
  string server_version = 12;
  string manifest_sha256 = 14;
  string target_version = 15;
  string target_commit = 16;
  uint64 release_sequence = 17;
  uint64 security_epoch = 18;
  string os = 19;
  string arch = 20;
  string artifact_name = 21;
  int64 artifact_size = 22;
  string artifact_sha256 = 23;
  bytes canonical_payload = 24;
  bytes signature = 25;
}

message AgentUpdateRootActionReceipt {
  reserved 15;
  reserved "result_root_version";
  string agent_public_id = 1;
  int64 assignment_id = 2;
  int64 campaign_id = 3;
  int64 generation = 4;
  AgentUpdateDesiredAction action = 5;
  uint64 command_sequence = 6;
  string authorization_sha256 = 7;
  bytes authorization_nonce = 8;
  string authority_key_id = 9;
  uint64 authority_epoch = 10;
  string activator_key_id = 11;
  uint64 root_action_counter = 12;
  int64 completed_at_unix_millis = 13;
  AgentUpdateRootActionResultKind result_kind = 14;
  string result_manifest_sha256 = 16;
  string result_version = 17;
  string result_commit = 18;
  uint64 result_release_sequence = 19;
  uint64 result_security_epoch = 20;
  string result_os = 21;
  string result_arch = 22;
  string result_artifact_name = 23;
  int64 result_artifact_size = 24;
