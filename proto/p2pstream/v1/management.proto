  int64 req_client_error = 4;
  int64 req_server_error = 5;
  int64 req_internal_error = 6;
  uint64 bytes_received = 7;
  uint64 bytes_sent = 8;
  int32 active_requests = 9;
  int64 reported_at_unix_millis = 10;
  double cpu_percent = 11;
  bool tunnel_capacity_adaptive = 12;
  int64 tunnel_admission_limit = 13;
  int64 tunnel_streams_in_use = 14;
  string memory_pressure = 15;
  int64 memory_usage_bytes = 16;
  int64 memory_limit_bytes = 17;
  string memory_source = 18;
  uint64 tunnel_pressure_rejections = 19;
  uint64 tunnel_limit_rejections = 20;
  int64 file_descriptors_used = 21;
  int64 file_descriptors_limit = 22;
  string resource_pressure_reason = 23;
  string resource_sample_error = 24;
  int64 resource_last_good_unix_millis = 25;
}

message GetStatusResponse {
  reserved 4;
  reserved "target_origin";

  bool proxy_running = 1;
  string proxy_last_error = 2;
  bool agent_connected = 3;
  AgentStatsSnapshot latest_agent_stats = 5;
  ProxyStatus proxy = 6;
  string version = 7;
  string commit = 8;
  string release_channel = 9;
}

message ProxyStatus {
  ProxyState state = 1;
  string last_error = 2;
  int64 started_at_unix_millis = 3;
  int64 stopped_at_unix_millis = 4;
  repeated PublicListenerStatus listeners = 5;
}

message PublicHeader {
  string name = 1;
  string value = 2;
}

message PublicRouteTargetUpstreamHeader {
  int64 id = 1;
  int64 target_id = 2;
  string name = 3;
  string value = 4;
  bool sensitive = 5;
  bool value_set = 6;
  int64 position = 7;
}

message PublicRouteTargetBasicAuth {
  bool enabled = 1;
  string username = 2;
  string password = 3;
  bool password_set = 4;
}

message PublicRouteTargetHealthCheck {
