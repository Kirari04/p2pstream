  int64 id = 1;
  int64 route_id = 2;
  string name = 3;
  int64 position = 4;
  int64 priority_group = 5;
  int64 weight = 6;
  bool enabled = 7;
  PublicRouteTargetType target_type = 8;
  string url = 9;
