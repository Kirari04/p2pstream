  bool enabled = 4;
  repeated string methods = 5;
  int64 max_retries = 6;
  PublicRetryFailureMode failure_mode = 7;
  PublicRetryBodyMode body_mode = 8;
  int64 max_replay_body_bytes = 9;
  repeated int64 route_ids = 10;
  repeated int64 target_ids = 11;
  PublicPolicyMatchRule match_rule = 12;
  int64 created_at_unix_millis = 13;
  int64 updated_at_unix_millis = 14;
  // Exact 400-599 upstream response statuses that trigger another attempt.
  repeated int64 retry_status_codes = 15;
  PublicRetryResponseBodyMode response_body_mode = 16;
  int64 max_buffered_response_body_bytes = 17;
  // Maximum time spent waiting for a protected response to complete before
  // falling back to normal streaming delivery.
  int64 max_buffered_response_wait_millis = 18;
}

